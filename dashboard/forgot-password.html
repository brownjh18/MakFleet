<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230ea5e9' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='5.5' cy='17.5' r='3.5'/%3E%3Ccircle cx='18.5' cy='17.5' r='3.5'/%3E%3Cpath d='M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-4H4v3.5a3.5 3.5 0 1 0 7 0z'/%3E%3Cpath d='M9 10l3 4h4l2-5h-3'/%3E%3C/svg%3E">
    <title>MakFleet AI - Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' },
                        accent: { 50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc', 400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf', 800: '#86198f', 900: '#701a75' },
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f1f5f9; }
        .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 25%, #312e81 50%, #1e1b4b 75%, #0f172a 100%); background-size: 400% 400%; animation: gradientShift 15s ease infinite; }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.3; animation: float 8s ease-in-out infinite; }
        .orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, #0ea5e9, transparent); top: -100px; right: -100px; }
        .orb-2 { width: 300px; height: 300px; background: radial-gradient(circle, #d946ef, transparent); bottom: -50px; left: -50px; animation-delay: 2s; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .glass-card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 24px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .gradient-text { background: linear-gradient(135deg, #0ea5e9 0%, #d946ef 50%, #f59e0b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .input-field { background: rgba(51, 65, 85, 0.5); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; padding: 14px 16px; color: #f1f5f9; transition: all 0.2s ease; }
        .input-field:focus { outline: none; border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2); }
        .input-field::placeholder { color: #64748b; }
        .btn-primary { background: linear-gradient(135deg, #0ea5e9, #d946ef); color: white; font-weight: 600; padding: 14px 32px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(14, 165, 233, 0.4); }
        .btn-primary:active { transform: translateY(0); }
        .error-message { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; display: none; }
        .success-message { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; display: none; }
        .code-input { width: 48px; height: 56px; text-align: center; font-size: 24px; font-weight: bold; background: rgba(51, 65, 85, 0.5); border: 2px solid rgba(148, 163, 184, 0.3); border-radius: 12px; color: #f1f5f9; transition: all 0.2s ease; }
        .code-input:focus { outline: none; border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2); }
        .step-indicator { display: flex; justify-content: center; margin-bottom: 24px; }
        .step { width: 12px; height: 12px; border-radius: 50%; margin: 0 8px; background: rgba(148, 163, 184, 0.3); transition: all 0.3s ease; }
        .step.active { background: #0ea5e9; width: 32px; border-radius: 6px; }
        .step.completed { background: #10b981; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="animated-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-card p-8 md:p-12 w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center shadow-lg shadow-primary-500/30 mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <h1 class="text-3xl font-bold mb-2">MakFleet <span class="gradient-text">AI</span></h1>
            <p class="text-slate-400" id="page-subtitle">Reset your password</p>
        </div>

        <!-- Step Indicator -->
        <div class="step-indicator">
            <div class="step active" id="step-1"></div>
            <div class="step" id="step-2"></div>
            <div class="step" id="step-3"></div>
        </div>

        <!-- Error/Success Messages -->
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <!-- Step 1: Enter Email -->
        <div id="step-email" class="step-content">
            <p class="text-sm text-slate-400 text-center mb-6">Enter your email address and we'll send you a verification code.</p>
            <form id="email-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                    <input type="email" id="email" name="email" class="input-field w-full" placeholder="your@email.com" required>
                </div>
                <button type="submit" class="btn-primary w-full flex items-center justify-center space-x-2">
                    <span>Send Verification Code</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                </button>
            </form>
        </div>

        <!-- Step 2: Enter Code -->
        <div id="step-code" class="step-content hidden">
            <p class="text-sm text-slate-400 text-center mb-6">Enter the 6-digit code sent to <span id="display-email" class="text-primary-400"></span></p>
            <form id="code-form" class="space-y-6">
                <div class="flex justify-center space-x-3">
                    <input type="text" maxlength="1" class="code-input" data-index="0" required>
                    <input type="text" maxlength="1" class="code-input" data-index="1" required>
                    <input type="text" maxlength="1" class="code-input" data-index="2" required>
                    <input type="text" maxlength="1" class="code-input" data-index="3" required>
                    <input type="text" maxlength="1" class="code-input" data-index="4" required>
                    <input type="text" maxlength="1" class="code-input" data-index="5" required>
                </div>
                <div class="text-center">
                    <p class="text-sm text-slate-400">
                        Didn't receive code? 
                        <button type="button" onclick="resendCode()" class="text-primary-400 hover:text-primary-300 font-medium">Resend</button>
                    </p>
                </div>
                <button type="submit" class="btn-primary w-full flex items-center justify-center space-x-2">
                    <span>Verify Code</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </button>
            </form>
        </div>

        <!-- Step 3: New Password -->
        <div id="step-password" class="step-content hidden">
            <p class="text-sm text-slate-400 text-center mb-6">Create a new password for your account.</p>
            <form id="password-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">New Password</label>
                    <input type="password" id="new-password" name="new-password" class="input-field w-full" placeholder="Enter new password" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" class="input-field w-full" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn-primary w-full flex items-center justify-center space-x-2">
                    <span>Reset Password</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                </button>
            </form>
        </div>

        <!-- Back to Login -->
        <div class="mt-6 text-center">
            <p class="text-sm text-slate-400">
                Remember your password? 
                <a href="/login" class="text-primary-400 hover:text-primary-300 font-medium transition-colors">Sign In</a>
            </p>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-slate-500 mt-6">
            &copy; 2026 MakFleet AI. Makerere University.
        </p>
    </div>

    <script>
        let currentStep = 1;
        let userEmail = '';
        let verificationCode = '';

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => { errorEl.style.display = 'none'; }, 5000);
        }

        function showSuccess(message) {
            const successEl = document.getElementById('success-message');
            successEl.textContent = message;
            successEl.style.display = 'block';
            setTimeout(() => { successEl.style.display = 'none'; }, 5000);
        }

        function goToStep(step) {
            // Hide all steps
            document.querySelectorAll('.step-content').forEach(el => el.classList.add('hidden'));
            
            // Show target step
            document.getElementById(`step-${['email', 'code', 'password'][step - 1]}`).classList.remove('hidden');
            
            // Update step indicators
            for (let i = 1; i <= 3; i++) {
                const indicator = document.getElementById(`step-${i}`);
                indicator.classList.remove('active', 'completed');
                if (i < step) indicator.classList.add('completed');
                if (i === step) indicator.classList.add('active');
            }
            
            currentStep = step;
        }

        // Step 1: Email form
        document.getElementById('email-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const submitBtn = this.querySelector('button[type="submit"]');
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/></svg><span>Sending...</span>';
            
            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    userEmail = email;
                    document.getElementById('display-email').textContent = email;
                    goToStep(2);
                    showSuccess('Verification code sent! Check your email (and console for testing).');
                } else {
                    showError(data.detail || 'Failed to send code. Please try again.');
                }
            } catch (error) {
                showError('Connection error. Please check if the server is running.');
            }
            
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Send Verification Code</span><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>';
        });

        // Code input auto-focus
        document.querySelectorAll('.code-input').forEach((input, index, inputs) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Step 2: Code form
        document.getElementById('code-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const code = Array.from(document.querySelectorAll('.code-input')).map(input => input.value).join('');
            
            if (code.length !== 6) {
                showError('Please enter all 6 digits of the verification code.');
                return;
            }
            
            verificationCode = code;
            goToStep(3);
        });

        // Resend code
        async function resendCode() {
            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail }),
                });
                
                if (response.ok) {
                    showSuccess('New verification code sent!');
                }
            } catch (error) {
                showError('Failed to resend code.');
            }
        }

        // Step 3: Password form
        document.getElementById('password-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (newPassword !== confirmPassword) {
                showError('Passwords do not match.');
                return;
            }
            
            if (newPassword.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }
            
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/></svg><span>Resetting...</span>';
            
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: userEmail,
                        code: verificationCode,
                        new_password: newPassword
                    }),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess('Password reset successfully! Redirecting to login...');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showError(data.detail || 'Failed to reset password. Please try again.');
                }
            } catch (error) {
                showError('Connection error. Please check if the server is running.');
            }
            
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Reset Password</span><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>';
        });

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            if (token) {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
